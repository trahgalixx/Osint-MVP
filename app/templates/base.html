<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OSINT Recon{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1216;
      --surface: #171b21;
      --surface-2: #1e232b;
      --border: #2a3039;
      --text: #e6e9ee;
      --muted: #8b94a3;
      --accent: #3fb68b;
      --accent-ink: #06130e;
      --danger: #e5604d;
      --warn: #e0a83a;
      --info: #4f9cf0;
      --radius: 8px;
      --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    a { color: var(--info); text-decoration: none; }
    a:hover { text-decoration: underline; }

    header.top { border-bottom: 1px solid var(--border); background: var(--surface); }
    header.top .inner { max-width: 1280px; margin: 0 auto; padding: 12px 16px;
      display: flex; align-items: center; gap: 12px; }
    header.top .brand { font-weight: 700; letter-spacing: .02em; color: var(--text); }
    header.top .brand span { color: var(--accent); }
    header.top nav { margin-left: auto; display: flex; gap: 16px; font-size: 13px; }
    header.top nav a { color: var(--muted); }

    main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600;
      text-transform: uppercase; letter-spacing: .06em; }
    .sub { color: var(--muted); margin: 0 0 20px; }

    .card { background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin-bottom: 20px; }

    input, select, button { font: inherit; color: var(--text); }
    input[type=text], input[type=search], select {
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;
      padding: 8px 10px; min-width: 0; }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button { cursor: pointer; border-radius: 6px; padding: 8px 14px;
      border: 1px solid var(--border); background: var(--surface-2); }
    button:hover { border-color: var(--muted); }
    button.primary { background: var(--accent); color: var(--accent-ink);
      border-color: var(--accent); font-weight: 600; }
    button.primary:hover { filter: brightness(1.08); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    button.link { background: none; border: none; padding: 0; color: var(--danger); font-size: 13px; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border);
      vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase;
      letter-spacing: .05em; white-space: nowrap; user-select: none; }
    th.sortable { cursor: pointer; }
    th.sortable:hover { color: var(--text); }
    tbody tr:hover { background: var(--surface-2); }
    td.mono, .mono { font-family: var(--mono); font-size: 13px; word-break: break-all; }
    td.num { font-variant-numeric: tabular-nums; }
    .empty { color: var(--muted); text-align: center; padding: 28px; }

    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px;
      border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
      border: 1px solid transparent; }
    .badge.RUNNING, .badge.PENDING { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
    .badge.COMPLETED { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
    .badge.FAILED { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
    .badge.RUNNING::before, .badge.PENDING::before { content: ""; width: 7px; height: 7px;
      border-radius: 50%; background: currentColor; animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { opacity: .25; } }

    .type-pill { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 11px;
      font-weight: 700; font-family: var(--mono); color: #0b0d10; white-space: nowrap; }

    .error { color: var(--danger); font-size: 13px; margin-top: 8px; min-height: 1em; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="top">
    <div class="inner">
      <a class="brand" href="/">OSINT<span>Recon</span></a>
      <nav>
        <a href="/">Dashboard</a>
        <a href="/docs" target="_blank" rel="noopener">API Docs</a>
      </nav>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Shared helpers
    const TYPE_COLORS = {
      DOMAIN_NAME: "#3fb68b",
      SUBDOMAIN:   "#7cc7f2",
      IP_ADDRESS:  "#e0a83a",
      ASN_INFO:    "#c88cf0",
      GEO_LOCATION:"#f08c8c",
      MAIL_SERVER: "#9ad16b",
      NAME_SERVER: "#d6d26a",
      USERNAME:      "#3fb68b",
      EMAIL_ADDRESS: "#f2b36b",
      PERSON_NAME:   "#3fb68b",
      ORGANIZATION:  "#3fb68b",
      WEB_MENTION:   "#8fa3bf",
      SOCIAL_PROFILE:"#5fb3f0",
      MANUAL_CHECK:  "#b0a48a",
      BREACH_INFO:   "#e5604d",
    };
    function typeColor(t) {
      if (TYPE_COLORS[t]) return TYPE_COLORS[t];
      let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) % 360;
      return `hsl(${h} 60% 68%)`;
    }
    function el(tag, attrs = {}, ...children) {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === "class") n.className = v;
        else if (k === "style") n.style.cssText = v;
        else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
        else n.setAttribute(k, v);
      }
      for (const c of children) n.append(c instanceof Node ? c : document.createTextNode(c ?? ""));
      return n;
    }
    function badge(status) { return el("span", { class: `badge ${status}` }, status); }
    function typePill(t) { return el("span", { class: "type-pill", style: `background:${typeColor(t)}` }, t); }
    function fmtDate(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "medium" });
    }
    function duration(a, b) {
      if (!a) return "—";
      const s = Math.max(0, Math.round(((b ? new Date(b) : new Date()) - new Date(a)) / 1000));
      return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`;
    }
    async function api(url, opts) {
      const r = await fetch(url, opts);
      if (!r.ok) {
        let msg = `${r.status} ${r.statusText}`;
        try {
          const j = await r.json();
          msg = typeof j.detail === "string" ? j.detail : (j.detail?.[0]?.msg ?? msg);
        } catch {}
        throw new Error(msg);
      }
      return r.json();
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
